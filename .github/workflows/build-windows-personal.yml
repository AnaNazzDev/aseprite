name: Build Aseprite Windows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows-personal.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Download Aseprite
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Configure Visual Studio
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build Aseprite with official script
        shell: bash
        run: bash build.sh --auto --norun

      - name: Prepare portable version
        shell: pwsh
        run: |
          if (!(Test-Path "build/bin/aseprite.exe")) {
            throw "aseprite.exe n'a pas été généré"
          }

          $package = Join-Path $env:RUNNER_TEMP "Aseprite-Windows-x64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "build/bin/*" $package -Recurse -Force

      - name: Upload Aseprite
        uses: actions/upload-artifact@v6
        with:
          name: Aseprite-Windows-x64
          path: ${{ runner.temp }}/Aseprite-Windows-x64
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
